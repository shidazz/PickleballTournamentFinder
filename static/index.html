<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Tournaments Near Me</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.css" />
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        .overlay {
            position: absolute;
            bottom: 20px;
            left: 50px; /* Adjusted for spacing from the bar */
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 1;
            z-index: 1; /* Ensure the overlay is under the toggle bar */
        }
        .overlay.hidden {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }
        #toggle-bar {
            position: absolute;
            left: 0;
            bottom: 30px; /* Matches the bottom alignment of the overlay */
            width: 25px;
            height: 200px;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-top-right-radius: 5px;
            border-bottom-right-radius: 5px;
            user-select: none;
            z-index: 2; /* Ensure the toggle bar is above everything */
        }
        #loading {
            position: absolute;
            bottom: 80px;
            left: 80px;
            display: none;
            z-index: 3;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #007bff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            margin: 0;
            color: #333;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.7);
        }
        .overlay input[type="text"], .overlay input[type="date"], .overlay select {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
        }
        .overlay .slider {
            width: 90%;
            margin: 10px 0;
        }
        .overlay button {
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .overlay button:hover {
            background-color: #0056b3;
        }
        .overlay .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        .overlay .checkbox-container label {
            margin-left: 5px;
            font-size: 15px;
        }
        .overlay .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .overlay .form-row {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .overlay .dropdown-search-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay .skill-level-container {
            margin-right: 10px;
        }
        .overlay .image-container {
            text-align: center;
            margin-bottom: 5px;
        }
        .overlay .clickable-image {
            max-width: 100%;
            width: 200px;
            height: auto;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin-left: -10px;
        }

        .overlay .clickable-image:hover {
            transform: scale(1.05);
        }

        @media screen and (max-width: 768px) {
            .overlay input[type="text"], .overlay input[type="date"], .overlay select {
                width: 90%;
            }
            .overlay .slider-container {
                flex-direction: column;
            }
            .overlay .slider {
                margin: 0 0 10px 0;
            }
            .overlay button {
                padding: 10px 20px;
                margin: 5px;
            }
            .overlay .form-row {
                flex-direction: column;
            }
            .overlay .dropdown-search-container {
                flex-direction: column;
            }
        }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDWe67VvbE-aTyPUm8oOun87Xg1-KmezFU&callback=initMap" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.js"></script>
</head>
<body>
    <h1>Pickleball Tournaments Near Me</h1>
    <div id="map"></div>
    <div id="toggle-bar">☰</div>
    <div id="loading"><div class="spinner"></div></div>
    <div class="overlay" id="overlay">
        <form id="inputForm">
            <div class="image-container">
                <a href="https://www.selkirk.com?sca_ref=7289579.spPkf3NQfC" target="_blank">
                    <img src="/static/Selkirk-Logo-2-3.png" alt="Pickleball Gear" class="clickable-image">
                </a>
            </div>

            <div class="form-group">
                <div class="form-row">
                    <input type="text" id="zipcode" name="zipcode" placeholder="Enter your location" required>
                    <input type="text" id="distance" name="distance" placeholder="Enter a distance (in miles)" required>
                </div>
                <div class="form-row">
                    <input type="date" id="start-date" name="start-date" required>
                    <input type="date" id="end-date" name="end-date" required>
                </div>
                <div class="slider" id="date-slider"></div>
                <div class="dropdown-search-container">
                    <div class="skill-level-container">
                        <select id="skill-level" name="skill-level">
                            <option value="" disabled selected>Skill Level</option>
                            <option value="any">Any</option>
                            <option value="3.0">3.0</option>
                            <option value="3.5">3.5</option>
                            <option value="4.0">4.0</option>
                            <option value="4.5">4.5</option>
                            <option value="5.0">5.0</option>
                            <option value="pro">Pro</option>
                        </select>
                    </div>
                    <button type="submit">Search</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        let map;
        let currentInfoWindow = null;
        let markers = [];
        const toggleBar = document.getElementById('toggle-bar');
        const overlay = document.getElementById('overlay');
        const loading = document.getElementById('loading');

        toggleBar.addEventListener('click', () => {
            overlay.classList.toggle('hidden');
        });

        document.getElementById('inputForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            overlay.classList.add('hidden'); // Hide overlay on search
            loading.style.display = 'block'; // Show loading spinner
            clearMarkers();

            const zipcode = document.getElementById('zipcode').value;
            const distance = document.getElementById('distance').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const skillLevel = document.getElementById('skill-level').value;

            const response = await fetch('/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ zipcode, distance, startDate, endDate, skillLevel })
            });

            const result = await response.json();
            displayLocations(result.locations);
            loading.style.display = 'none'; // Hide loading spinner
        });

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 4,
                center: { lat: 39.8283, lng: -98.5795 } // Center of the US
            });
        }


        document.getElementById('inputForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearMarkers();
            const zipcode = document.getElementById('zipcode').value;
            const distance = document.getElementById('distance').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const skillLevel = document.getElementById('skill-level').value;

            const response = await fetch('/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ zipcode, distance, startDate, endDate, skillLevel })
            });

            const result = await response.json();
            displayLocations(result.locations);
        });

        function displayLocations(locations) {
            locations.forEach(location => {
                const markerSize = getMarkerSize(location.registered_players);
                const markerIcon = {
                    url: 'https://www.pinclipart.com/picdir/big/110-1108602_havent-tried-pickleball-yet-want-to-get-more.png',
                    scaledSize: markerSize,
                    anchor: new google.maps.Point(markerSize.width / 2, markerSize.height / 2)
                };

                const marker = new google.maps.Marker({
                    position: location.coordinates,
                    map: map,
                    title: location.title,
                    icon: markerIcon
                });

                const infowindow = new google.maps.InfoWindow({
                    content: `
                        <div style="width: 350px;">
                            <h3 style="margin-top: 0;">${location.title}</h3>
                            <img src="${location.image}" alt="${location.title}" style="float: left; margin-right: 10px; width: 80px; height: auto;">
                            <p><strong>Date:</strong> ${location.date}</p>
                            <p><strong>Registered Players:</strong> ${location.registered_players}</p>
                            <p>${location.address}</p>
                            <a href="${location.link}" target="_blank">More Info</a>
                        </div>`
                });

                marker.addListener('click', function() {
                    handleMarkerClick(marker);
                });

                markers.push({ marker, infowindow, size: markerSize });
            });
        }

        function handleMarkerClick(clickedMarker) {
            // Find markers intersecting with the clicked marker
            const intersectingMarkers = markers.filter(({ marker, size }) =>
                calculateIntersection(clickedMarker, marker, size)
            );

            // Cycle through intersecting markers
            if (!clickedMarker.intersectIndex) {
                clickedMarker.intersectIndex = 0;
            }

            const nextIndex = clickedMarker.intersectIndex % intersectingMarkers.length;
            const { marker: nextMarker, infowindow } = intersectingMarkers[nextIndex];

            if (currentInfoWindow) {
                currentInfoWindow.close();
            }

            infowindow.open(map, nextMarker);
            currentInfoWindow = infowindow;
            clickedMarker.intersectIndex++;
        }

        function calculateIntersection(markerA, markerB, markerBSize) {
            const projection = map.getProjection();
            const pointA = projection.fromLatLngToPoint(markerA.getPosition());
            const pointB = projection.fromLatLngToPoint(markerB.getPosition());

            // Calculate pixel dimensions of marker
            const pixelWidth = markerBSize.width / (2 ** map.getZoom());
            const pixelHeight = markerBSize.height / (2 ** map.getZoom());

            // Check overlap percentage
            const xOverlap = Math.max(0, pixelWidth - Math.abs(pointA.x - pointB.x));
            const yOverlap = Math.max(0, pixelHeight - Math.abs(pointA.y - pointB.y));
            const overlapArea = xOverlap * yOverlap;

            const markerArea = pixelWidth * pixelHeight;
            return overlapArea / markerArea >= 0.4;
        }

        function getMarkerSize(registeredPlayers) {
            const minSize = 30;
            const maxSize = 120;
            const maxPlayers = 800;
            const size = Math.min(maxSize, minSize + (registeredPlayers / maxPlayers) * (maxSize - minSize));
            return { width: size, height: size };
        }

        function clearMarkers() {
            markers.forEach(({ marker }) => marker.setMap(null));
            markers = [];
        }

        function updateDateInputs(values, startDateElement, endDateElement, baseDate) {
            const [startDateOffset, endDateOffset] = values.map(value => parseInt(value, 10));

            const startDate = new Date(baseDate);
            startDate.setDate(startDate.getDate() + startDateOffset);
            startDateElement.value = startDate.toISOString().split('T')[0];

            const endDate = new Date(baseDate);
            endDate.setDate(endDate.getDate() + endDateOffset);
            endDateElement.value = endDate.toISOString().split('T')[0];
        }

        function updateDateRangeInputs() {
            const startDate = new Date();
            const endDate = new Date();
            endDate.setFullYear(endDate.getFullYear() + 1);

            const dateSlider = document.getElementById('date-slider');
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');

            noUiSlider.create(dateSlider, {
                start: [0, 365],
                connect: true,
                range: {
                    min: 0,
                    max: 365
                },
                tooltips: false,
                format: {
                    to: value => Math.round(value),
                    from: value => Number(value)
                }
            });

            dateSlider.noUiSlider.on('update', (values) => {
                updateDateInputs(values, startDateInput, endDateInput, startDate);
            });

            startDateInput.value = startDate.toISOString().split('T')[0];
            endDateInput.value = endDate.toISOString().split('T')[0];

            startDateInput.addEventListener('change', () => {
                const inputDate = new Date(startDateInput.value);
                const offset = Math.round((inputDate - startDate) / (1000 * 60 * 60 * 24));
                dateSlider.noUiSlider.set([offset, null]);
            });

            endDateInput.addEventListener('change', () => {
                const inputDate = new Date(endDateInput.value);
                const offset = Math.round((inputDate - startDate) / (1000 * 60 * 60 * 24));
                dateSlider.noUiSlider.set([null, offset]);
            });
        }

        window.onload = updateDateRangeInputs;
    </script>
</body>
</html>
